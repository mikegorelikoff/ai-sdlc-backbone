site_name: AI SDLC Backbone
site_description: Public documentation for the licensed AI SDLC Backbone product.
site_url: https://mikegorelikoff.github.io/ai-sdlc-backbone/
repo_url: https://github.com/mikegorelikoff/ai-sdlc-backbone
repo_name: mikegorelikoff/ai-sdlc-backbone
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins: []

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - assets/stylesheets/ai-sdlc.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mikegorelikoff/ai-sdlc-backbone
      name: AI SDLC Backbone on GitHub

copyright: Copyright &copy; 2026 AI SDLC Backbone contributors

exclude_docs: |
  scripts/
  tests/

not_in_nav: |
  adoption/*.md
  explanation/*.md
  how-to/*.md
  maintainers/*.md
  operations/*.md
  roles/*.md
  tutorials/*.md
  roadmap.md
  start.md
  start-here/first-run.md
  start-here/prerequisites.md
  reference/compatibility.md
  reference/skills-overview.md
  reference/supported-environments.md
  reference/versions.md

nav:
  - Home: index.md
  - Start here:
      - Overview: start-here/index.md
  - How it works:
      - Overview: how-it-works/index.md
  - Guides:
      - Overview: guides/index.md
      - Install the Backbone: guides/install.md
  - Reference:
      - Overview: reference/index.md
      - Licensing: reference/licensing.md
      - Licensing API: reference/licensing-api.yaml
  - Project:
      - Overview: project/index.md
      - Security and privacy: project/security-privacy.md
      - Documentation decisions: project/decision-log.md
