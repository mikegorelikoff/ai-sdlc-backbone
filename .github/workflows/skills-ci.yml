name: skills-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-install:
    name: portable-install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Portable installer and profile tests
        run: python -m unittest discover -s skills/ai-sdlc-shared-runtime/tests -p test_native_install.py -v

  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            parser-lock: parser-lock-linux-cp310.toon
          - python-version: "3.13"
            parser-lock: parser-lock-linux-cp313.toon
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Compatibility validates the ordered release history from v2.1.0.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download exact graph runtime wheels
        run: >-
          python -m pip download --only-binary=:all: --no-deps
          --dest "$RUNNER_TEMP/ai-sdlc-graph-wheelhouse"
          tree-sitter==0.25.2
          tree-sitter-typescript==0.23.2
          tree-sitter-python==0.25.0
          tree-sitter-javascript==0.25.0
          tree-sitter-java==0.23.5
          tree-sitter-c-sharp==0.23.5
          tree-sitter-php==0.24.1
          tree-sitter-bash==0.25.1
          tree-sitter-cpp==0.23.4
          tree-sitter-go==0.25.0
          tree-sitter-rust==0.24.2
          tree-sitter-kotlin==1.1.0
          tree-sitter-swift==0.7.3
      - name: Verify and install graph runtime offline
        run: >-
          python skills/ai-sdlc-context-cache/scripts/install_graph_runtime.py
          --lock skills/ai-sdlc-context-cache/references/${{ matrix.parser-lock }}
          --wheelhouse "$RUNNER_TEMP/ai-sdlc-graph-wheelhouse"
      - name: Prove offline graph preflight
        run: >-
          python skills/ai-sdlc-context-cache/tests/install_graph_smoke.py
          --lock skills/ai-sdlc-context-cache/references/${{ matrix.parser-lock }}
          --wheelhouse "$RUNNER_TEMP/ai-sdlc-graph-wheelhouse"
          --offline --format toon
      - name: Compile helpers
        run: python -m compileall -q skills
      - name: All shared runtime tests
        run: python -m unittest discover -s skills/ai-sdlc-shared-runtime/tests -p 'test*.py' -v
      - name: Repository contract tests
        run: python skills/ai-sdlc-shared-runtime/tests/test_all_skill_scripts.py
      - name: Release compatibility
        run: python skills/ai-sdlc-shared-runtime/scripts/ai_sdlc_compatibility.py --skip-git-audit --format toon
      - name: Per-skill tests
        run: python skills/ai-sdlc-shared-runtime/tests/test_each_skill_tests.py
